<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MatchDrop">
<!-- No web manifest on purpose: without one, Add to Home Screen keeps this
     exact address, including the #k= pairing key, so the icon stays paired. -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>MatchDrop</title>
<style>
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --text: #1d1d1f; --muted: #5f6368;
    --line: #c9cbd1; --accent: #2457d6; --accent-text: #ffffff; --warn: #8a5300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f11; --surface: #17191c; --text: #f2f3f5; --muted: #a2a7ae;
      --line: #3a3e45; --accent: #4f7dff; --accent-text: #ffffff; --warn: #f0b45a;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 17px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif;
    min-height: 100vh; display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 4px; }
  .lead { color: var(--muted); margin-bottom: 28px; }
  a.go {
    display: flex; align-items: center; justify-content: center; min-height: 56px;
    background: var(--accent); color: var(--accent-text); text-decoration: none;
    font-weight: 600; font-size: 18px; border-radius: 14px; margin-bottom: 10px;
  }
  a.go:active { opacity: 0.85; }
  a.go[hidden] { display: none; }
  .addr { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; margin-bottom: 24px; }
  .note { color: var(--warn); font-size: 15px; margin-bottom: 16px; }
  .note:empty { display: none; }
  section {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px;
  }
  section h2 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  ol { padding-left: 20px; color: var(--muted); font-size: 15px; }
  li + li { margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>MatchDrop</h1>
  <p class="lead" id="lead">Looking for your Mac…</p>
  <p class="note" id="note"></p>
  <a class="go" id="go" hidden>Open MatchDrop</a>
  <p class="addr" id="addr"></p>
  <section>
    <h2>If it doesn't open</h2>
    <ol>
      <li>Put this phone on the same Wi-Fi as the Mac, or put the Mac on this phone's hotspot.</li>
      <li>Open MatchDrop on the Mac.</li>
      <li>Come back here and tap Open MatchDrop again.</li>
    </ol>
  </section>
</main>
<script>
  // The pairing key arrives once in the #fragment (from the QR code on the
  // Mac). Fragments never reach a server; the key is kept on this phone.
  const fromHash = new URLSearchParams(location.hash.slice(1)).get("k");
  let key = fromHash;
  try {
    if (fromHash) localStorage.setItem("md_key", fromHash);
    key = key || localStorage.getItem("md_key");
  } catch (e) { /* private mode: the #k= in this address still works */ }

  const $ = (id) => document.getElementById(id);

  async function load() {
    try {
      const r = await fetch("candidates.json?ts=" + Date.now(), { cache: "no-store" });
      const c = await r.json();
      if (!c.ip) throw new Error("no address yet");
      const base = `http://${c.ip}:${c.port || 8787}/`;
      $("go").href = key ? `${base}?k=${encodeURIComponent(key)}` : base;
      $("go").hidden = false;
      $("addr").textContent = `${c.ip}:${c.port || 8787}`;
      $("lead").textContent = key ? "Your Mac's dashboard." : "View only. Scan the code in Setup on your Mac to control MatchDrop from this phone.";
      const hours = (Date.now() / 1000 - (c.updated || 0)) / 3600;
      $("note").textContent = hours > 6 ? "Your Mac hasn't checked in for a while. Open MatchDrop on the Mac first." : "";
    } catch (e) {
      $("lead").textContent = "Open MatchDrop on the Mac, then reload this page.";
    }
  }
  load();
  setInterval(load, 20000);
</script>
</body>
</html>
